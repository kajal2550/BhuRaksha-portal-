{% extends 'base.html' %}

{% block title %}Farmer Self-Signup | BhuRaksha{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            
            <div class="cyber-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-success display-4 mb-2"></i>
                    <h4 class="fw-bold text-white font-monospace">FARMER_REGISTRATION // DPI_ENROLL</h4>
                    <p class="text-muted small">Creates a farmer account with encrypted PII and access to your landholding records.</p>
                </div>

                <form method="POST" action="{% url 'register_user' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small font-monospace">FULL NAME</label>
                        <input type="text" name="full_name" class="form-control cyber-input" placeholder="e.g. Gurpreet Singh Dhillon" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small font-monospace">CHOOSE USERNAME</label>
                        <input type="text" name="username" class="form-control cyber-input" placeholder="e.g. gurpreet_phagwara" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small font-monospace">AADHAAR (NATIONAL ID)</label>
                            <input type="text" name="aadhaar" class="form-control cyber-input" placeholder="XXXX-XXXX-XXXX" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small font-monospace">CONTACT NUMBER</label>
                            <input type="text" name="phone" class="form-control cyber-input" placeholder="+91 98144 XXXXX" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted small font-monospace">PASSWORD</label>
                            <input type="password" name="password" class="form-control cyber-input" minlength="8" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small font-monospace">CONFIRM PASSWORD</label>
                            <input type="password" name="confirm_password" class="form-control cyber-input" minlength="8" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyber-green w-100 py-2 fw-bold mb-3">
                        <i class="bi bi-shield-check me-2"></i> Register Farmer Identity
                    </button>

                    <div class="text-center">
                        <span class="text-muted small">Already registered?</span>
                        <a href="{% url 'login' %}" class="small text-info text-decoration-none fw-bold ms-1">Sign In</a>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
